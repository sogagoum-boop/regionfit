<script>
    // ================================================================
    // CONFIGURATION - Aucune clé stockée dans le code
    // ================================================================
    // La clé est demandée à l'utilisateur lors de l'analyse

    // ================================================================
    // ANALYSE DE LA PHOTO AVEC GEMINI VISION (Version Sécurisée)
    // ================================================================
    async function analyzePhoto(imageData) {
        loader.classList.add('active');
        resultDiv.style.display = 'none';

        try {
            // === DEMANDER LA CLÉ À L'UTILISATEUR ===
            let apiKey = localStorage.getItem('gemini_api_key');
            
            if (!apiKey) {
                apiKey = prompt(
                    "🔑 Entrez votre clé API Gemini :\n\n" +
                    "1. Allez sur https://makersuite.google.com/\n" +
                    "2. Connectez-vous avec votre compte Google\n" +
                    "3. Cliquez sur 'Get API Key'\n" +
                    "4. Créez une nouvelle clé\n" +
                    "5. Collez-la ici\n\n" +
                    "⚠️ Cette clé restera sur votre appareil et ne sera jamais sauvegardée sur GitHub."
                );
                
                if (!apiKey) {
                    loader.classList.remove('active');
                    alert('❌ Une clé API est nécessaire pour l\'analyse.');
                    return;
                }
                
                // Sauvegarder pour la session (sur votre appareil uniquement)
                localStorage.setItem('gemini_api_key', apiKey);
            }

            // Préparer l'image
            const base64Image = imageData.split(',')[1];

            const prompt = `Vous êtes un expert en nutrition. Analysez cette photo d'aliment ou de repas.

            Retournez UNIQUEMENT un JSON valide avec ces champs :
            {
                "food_name": "Nom de l'aliment principal détecté",
                "calories": estimation des calories pour ce repas (nombre),
                "protein": protéines en grammes (nombre),
                "carbs": glucides en grammes (nombre),
                "fats": lipides en grammes (nombre),
                "warnings": ["avertissement 1", "avertissement 2"],
                "improvements": ["amélioration 1", "amélioration 2"]
            }

            Répondez UNIQUEMENT en JSON, sans aucun autre texte.`;

            // Appel à l'API Gemini
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro-vision:generateContent?key=${apiKey}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: 'image/jpeg', data: base64Image } }
                            ]
                        }]
                    })
                }
            );

            if (!response.ok) {
                const errorData = await response.json();
                console.error('Erreur API Gemini:', errorData);
                
                // Si erreur 403 ou 401, la clé est invalide
                if (response.status === 403 || response.status === 401) {
                    localStorage.removeItem('gemini_api_key');
                    alert('❌ Clé API invalide. Veuillez en générer une nouvelle sur Google AI Studio.');
                }
                throw new Error(`Erreur API: ${errorData.error?.message || 'Inconnue'}`);
            }

            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            
            if (jsonMatch) {
                const result = JSON.parse(jsonMatch[0]);
                displayResult({
                    calories: result.calories || 200,
                    protein: result.protein || 10,
                    carbs: result.carbs || 20,
                    fats: result.fats || 8,
                    foods: [result.food_name || 'Aliment détecté'],
                    warnings: result.warnings || ['Aucun avertissement'],
                    improvements: result.improvements || ['Aucune amélioration suggérée']
                }, imageData);
            } else {
                throw new Error('Réponse JSON invalide');
            }

        } catch (error) {
            console.error('Erreur analyse Gemini:', error);
            loader.classList.remove('active');
            alert(`❌ Erreur d'analyse :\n${error.message}`);
        }
    }

    // ================================================================
    // RÉINITIALISER LA CLÉ (si besoin)
    // ================================================================
    function resetApiKey() {
        localStorage.removeItem('gemini_api_key');
        alert('✅ Clé API réinitialisée. Vous pourrez en saisir une nouvelle au prochain scan.');
     Version 2.3 - Sécurisée
    }
</script>
